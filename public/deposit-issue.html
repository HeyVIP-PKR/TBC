<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deposit Issue</title>
<script src="/assets/theme.js"></script>
<script src="/assets/authguard.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{--bg:#070d1a;--bg2:#0f1c30;--bg3:#16263d;--text:#eef3fb;--text2:#8fa3bd;--border:#1f3a5a;--blue:#4fa6f5;--card:#0f1c30;
  background:var(--bg);color:var(--text);min-height:100vh;padding:22px}
.wrap{max-width:1100px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;text-decoration:none}
.back-btn:hover{background:rgba(255,255,255,.2)}
.hdr{font-size:20px;font-weight:800}

.brand-drop-wrap{position:relative;margin-bottom:12px;z-index:100}
.brand-drop-trigger{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;cursor:pointer;user-select:none;min-height:50px}
.brand-drop-trigger:hover{border-color:var(--blue)}
.brand-drop-trigger.open{border-color:var(--blue);border-bottom-left-radius:0;border-bottom-right-radius:0}
.bdt-abbr{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#1d6fc9,#4fa6f5)}
.bdt-img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(79,166,245,.4)}
.bdt-text{flex:1;min-width:0}
.bdt-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em}
.bdt-value{font-size:14px;font-weight:700;color:var(--text);margin-top:2px}
.bdt-arrow{font-size:11px;color:var(--text2);transition:transform .25s}
.brand-drop-trigger.open .bdt-arrow{transform:rotate(180deg)}
.brand-drop-menu{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1.5px solid var(--blue);border-top:none;border-bottom-left-radius:12px;border-bottom-right-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.4);overflow:hidden;display:none;max-height:280px;overflow-y:auto}
.brand-drop-menu.show{display:block}
.bdm-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}
.bdm-item:hover{background:var(--bg3)}
.bdm-item.selected{background:rgba(79,166,245,.1)}
.bdm-item.selected .bdm-name{color:var(--blue);font-weight:800}
.bdm-abbr{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;flex-shrink:0;background:#1e3a5f}
.bdm-img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid var(--border)}
.bdm-name{font-size:13px;font-weight:600;color:var(--text);flex:1}
.bdm-tick{font-size:13px;color:var(--blue);opacity:0}
.bdm-item.selected .bdm-tick{opacity:1}

.msearch-wrap{margin-bottom:12px}
.msearch-box{position:relative;display:flex;align-items:flex-start;gap:8px}
.msearch-ta{flex:1;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;outline:none;background:var(--bg2);color:var(--text);resize:none;min-height:44px;max-height:110px;line-height:1.5}
.msearch-ta:focus{border-color:var(--blue)}
.msearch-hint{font-size:11px;color:var(--text2);margin-top:5px}
.msearch-hint span{background:rgba(79,166,245,.12);color:var(--blue);padding:1px 6px;border-radius:4px;font-weight:700;font-size:10px}
.msearch-btn{padding:10px 18px;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;background:var(--blue);white-space:nowrap}
.msearch-btn:hover{opacity:.85}
.msearch-btn:disabled{opacity:.5;cursor:not-allowed}
.qtag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.qtag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;background:rgba(79,166,245,.15);border:1px solid rgba(79,166,245,.35);color:var(--blue);font-size:12px;font-weight:700}

.sec-lbl{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
.split{display:flex;gap:12px}
.res-col{flex:1;min-width:0}
.edit-col{width:320px;flex-shrink:0}
.rcard{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.rcard-h{padding:8px 12px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.badge.bd{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;background:#1e3a5f;color:#7ec8f7}
.rcard-id{font-size:14px;font-weight:700;color:var(--text)}
.rcard-tm{font-size:12px;color:var(--text2);margin-left:auto}
.rcard-b{padding:11px 13px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.fr{display:flex;flex-direction:column;gap:2px}
.fl{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fv{font-size:13px;color:var(--text);word-break:break-word}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.pg{background:#1a3a2a;color:#56d364}.po{background:#3a2a0a;color:#f0b429}
.pr{background:#3a1a1a;color:#f85149}.py{background:var(--bg3);color:var(--text2)}
.rcard-f{padding:6px 12px;border-top:1px solid var(--border)}
.btn-ed{padding:4px 11px;font-size:12px;border:1.5px solid var(--blue);border-radius:7px;background:transparent;color:var(--blue);cursor:pointer;font-weight:700}
.btn-ed:hover{background:var(--blue);color:#fff}
.btn-ed.active{background:var(--blue);color:#fff}
.epanel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px;position:sticky;top:20px}
.ep-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.etid{font-size:11px;color:var(--text2);font-weight:400;display:block;margin-top:2px}
.fg2{margin-bottom:8px}
.fl2{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:3px;display:block}
.fi{width:100%;padding:7px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:var(--bg3);color:var(--text)}
.fi:focus{border-color:var(--blue)}
.btn-sub{width:100%;padding:9px;background:var(--blue);color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
.btn-sub:hover{opacity:.88}
.btn-sub:disabled{background:#888;cursor:not-allowed}
.toast{display:none;text-align:center;padding:7px;font-size:13px;font-weight:700;border-radius:7px;margin-top:6px}
.tok{background:#1a3a2a;color:#56d364}.ter{background:#3a1a1a;color:#f85149}
.empty-h{text-align:center;padding:20px 8px;color:var(--text2);font-size:13px;line-height:1.8}
.no-r{text-align:center;padding:28px;color:var(--text2);font-size:14px;background:var(--card);border-radius:10px;border:1px dashed var(--border)}
.loading{text-align:center;padding:28px;color:var(--text2);font-size:14px}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a class="back-btn" href="/">← Back to Home</a>
    <div class="hdr">Deposit Issue</div>
  </div>

  <div class="brand-drop-wrap" id="brandDropWrap">
    <div class="brand-drop-trigger" id="brandDropTrigger">
      <div class="bdt-abbr" id="bdtIcon">ALL</div>
      <div class="bdt-text">
        <div class="bdt-label">Filter by Brand</div>
        <div class="bdt-value" id="bdtValue">All Brands</div>
      </div>
      <span class="bdt-arrow">▼</span>
    </div>
    <div class="brand-drop-menu" id="brandDropMenu"><div id="bdmList"></div></div>
  </div>

  <div class="msearch-wrap">
    <div class="msearch-box">
      <textarea class="msearch-ta" id="depQ" placeholder="Enter Transaction ID, Reference, Username, or Agent Number... — use comma to search multiple" rows="1"></textarea>
      <button class="msearch-btn" id="depBtn" onclick="doDep()">Search</button>
    </div>
    <div class="msearch-hint">Separate multiple IDs with <span>comma</span> — e.g. DGT4UBWVNM, ABC123, XYZ789</div>
    <div class="qtag-row" id="depQTags"></div>
  </div>

  <div class="split">
    <div class="res-col">
      <div class="sec-lbl" id="depLbl">Results</div>
      <div id="depRes"><div class="no-r">Select brand (optional) then enter one or more IDs to search</div></div>
    </div>
    <div class="edit-col">
      <div class="sec-lbl">Edit Record</div>
      <div class="epanel">
        <div class="empty-h" id="depHint">Click Edit on any result to start editing</div>
        <div id="depEF" style="display:none">
          <div class="ep-title">Editing<span class="etid" id="depEL"></span></div>
          <div class="fg2"><label class="fl2">CS PIC (col P)</label><input class="fi" id="ef-piccs" placeholder="CS PIC..."></div>
          <div class="fg2"><label class="fl2">Player Contact No (col Q)</label><input class="fi" id="ef-pcoNo" placeholder="Player contact no..."></div>
          <div class="fg2"><label class="fl2">Status CS (col R)</label><input class="fi" id="ef-statuscs" placeholder="Status CS..."></div>
          <div class="fg2"><label class="fl2">Correct UID (col S)</label><input class="fi" id="ef-uid" placeholder="Correct UID..."></div>
          <button class="btn-sub" id="depSub" onclick="subDep()">Submit — Update Sheet</button>
          <div class="toast" id="depT"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// PKR's 9 brands — logos reused from the existing site (public/assets/img/brands/*.png)
var BRANDS=[
  {id:"crickex",name:"Crickex"},{id:"betjili",name:"Betjili"},{id:"mostplay",name:"Mostplay"},
  {id:"jeetwin",name:"Jeetwin"},{id:"sbj66",name:"Sbj66"},{id:"heybaji",name:"Heybaji"},
  {id:"superbaji",name:"Superbaji"},{id:"kv8",name:"KV8"},{id:"darazplay",name:"Darazplay"},
];
function logoPath(id){return '/assets/img/brands/'+id+'.png';}

var _selBrand='',_ddOpen=false,curDep=null;
function gi(id){return document.getElementById(id);}

function buildBrandDropMenu(){
  var list=gi('bdmList');list.innerHTML='';
  var allItem=mkItem('','All Brands',null,true);
  allItem.onclick=function(){selectBrand('','All Brands',null);};
  list.appendChild(allItem);
  BRANDS.forEach(function(b){
    var item=mkItem(b.id,b.name,b.id,false);
    item.onclick=function(){selectBrand(b.id,b.name,b.id);};
    list.appendChild(item);
  });
  gi('brandDropTrigger').onclick=function(){toggleDD();};
  document.addEventListener('click',function(e){if(!gi('brandDropWrap').contains(e.target))closeDD();});
}
function mkItem(id,label,logoId,selected){
  var d=document.createElement('div');d.className='bdm-item'+(selected?' selected':'');d.dataset.id=id;
  if(logoId){
    var img=document.createElement('img');img.className='bdm-img';img.src=logoPath(logoId);img.alt='';
    img.onerror=function(){var ab=document.createElement('div');ab.className='bdm-abbr';ab.textContent=label.substring(0,3).toUpperCase();this.parentNode.replaceChild(ab,this);};
    d.appendChild(img);
  }else{
    var ab=document.createElement('div');ab.className='bdm-abbr';ab.textContent='ALL';d.appendChild(ab);
  }
  var nm=document.createElement('span');nm.className='bdm-name';nm.textContent=label;
  var tk=document.createElement('span');tk.className='bdm-tick';tk.textContent='✓';
  d.appendChild(nm);d.appendChild(tk);
  return d;
}
function toggleDD(){_ddOpen=!_ddOpen;var m=gi('brandDropMenu'),t=gi('brandDropTrigger');if(_ddOpen){m.classList.add('show');t.classList.add('open');}else closeDD();}
function closeDD(){_ddOpen=false;gi('brandDropMenu').classList.remove('show');gi('brandDropTrigger').classList.remove('open');}
function selectBrand(id,label,logoId){
  _selBrand=id;gi('bdtValue').textContent=label;
  var iconWrap=gi('bdtIcon');
  if(logoId){
    var img=document.createElement('img');img.id='bdtIcon';img.className='bdt-img';img.src=logoPath(logoId);img.alt='';
    img.onerror=function(){var ab=document.createElement('div');ab.id='bdtIcon';ab.className='bdt-abbr';ab.textContent='ALL';this.parentNode.replaceChild(ab,this);};
    iconWrap.parentNode.replaceChild(img,iconWrap);
  }else{
    var ab=document.createElement('div');ab.id='bdtIcon';ab.className='bdt-abbr';ab.textContent='ALL';
    iconWrap.parentNode.replaceChild(ab,iconWrap);
  }
  gi('bdmList').querySelectorAll('.bdm-item').forEach(function(el){el.classList.toggle('selected', el.dataset.id===id);});
  closeDD();
  // NOTE: brand filtering isn't applied server-side yet (search.js searches
  // the whole sheet regardless of _selBrand) — the dropdown is wired up and
  // ready for whenever this Sheet gets split/filterable by brand. If this
  // department's Sheet is Crickex-only (as your sample data suggested),
  // you may not need brand filtering here at all — worth confirming.
}
buildBrandDropMenu();

function parseQueries(str){return str.split(/[\n,]+/).map(function(q){return q.trim();}).filter(Boolean);}

function doDep(){
  var raw=gi('depQ').value.trim();if(!raw)return;
  var queries=parseQueries(raw);
  gi('depQTags').innerHTML=queries.map(function(q){return '<span class="qtag">'+q+'</span>';}).join('');
  var btn=gi('depBtn');btn.disabled=true;btn.textContent='Searching...';
  gi('depRes').innerHTML='<div class="loading">Searching '+queries.join(', ')+'...</div>';

  window.AgentAuth.authFetch('/api/deposit-issue/search', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ query: raw })
  })
    .then(function(r){return r.json();})
    .then(function(res){
      btn.disabled=false;btn.textContent='Search';
      if(!res.ok){gi('depRes').innerHTML='<div class="no-r">Error: '+(res.error||'search failed')+'</div>';return;}
      showDep(res.results||[]);
    })
    .catch(function(e){btn.disabled=false;btn.textContent='Search';gi('depRes').innerHTML='<div class="no-r">Error: '+e.message+'</div>';});
}

function showDep(data){
  gi('depLbl').textContent='Results ('+data.length+(data.length>=500?' — max 500':'')+')';
  window._dep=data;
  if(!data.length){gi('depRes').innerHTML='<div class="no-r">No results found.</div>';return;}
  gi('depRes').innerHTML=data.map(function(r,i){
    return '<div class="rcard"><div class="rcard-h">'
      +'<span class="badge bd">'+r.sheetName+' / '+r.tabName+'</span>'
      +'<span class="rcard-id">'+r.transaction+'</span><span class="rcard-tm">'+r.requestTime+'</span></div>'
      +'<div class="rcard-b"><div class="fg">'
      +f('Channel',r.channel)+f('Agent Number',r.agentNumber)
      +f('Username',r.username)+f('Reference',r.reference)
      +f('Cash Out Number',r.cashOutNumber)+f('Amount',r.amount)
      +fp('Status PG',r.statusPG)+f('Cart ID',r.cartId)
      +f('Support PIC',r.supportPIC)+f('CS PIC',r.csPIC)
      +f('Player Contact No',r.playerContactNo)+fp('Status CS',r.statusCS)
      +f('Correct UID',r.correctUid)
      +'</div></div>'
      +'<div class="rcard-f"><button class="btn-ed" id="deb-'+i+'" onclick="openDep('+i+')">Edit</button></div></div>';
  }).join('');
}

function openDep(i){
  var r=window._dep[i];curDep=r;
  document.querySelectorAll('.btn-ed').forEach(function(b){b.classList.remove('active');});
  gi('deb-'+i).classList.add('active');
  gi('depHint').style.display='none';gi('depEF').style.display='block';
  gi('depEL').textContent=' — '+r.transaction+' ('+r.sheetName+')';
  gi('depT').style.display='none';
  gi('ef-piccs').value=r.csPIC||'';gi('ef-pcoNo').value=r.playerContactNo||'';gi('ef-statuscs').value=r.statusCS||'';gi('ef-uid').value=r.correctUid||'';
}

function subDep(){
  if(!curDep)return;
  var btn=gi('depSub');btn.disabled=true;btn.textContent='Updating...';
  window.AgentAuth.authFetch('/api/deposit-issue/update', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      tabName: curDep.tabName,
      rowIndex: curDep.rowIndex,
      csPIC: gi('ef-piccs').value,
      playerContactNo: gi('ef-pcoNo').value,
      statusCS: gi('ef-statuscs').value,
      correctUid: gi('ef-uid').value,
    })
  })
    .then(function(r){return r.json();})
    .then(function(res){
      btn.disabled=false;btn.textContent='Submit — Update Sheet';
      showT('depT', res.ok, res.error);
      if(res.ok){
        // reflect the save locally so the result card updates without a re-search
        curDep.csPIC=gi('ef-piccs').value;curDep.playerContactNo=gi('ef-pcoNo').value;
        curDep.statusCS=gi('ef-statuscs').value;curDep.correctUid=gi('ef-uid').value;
      }
    })
    .catch(function(e){btn.disabled=false;btn.textContent='Submit — Update Sheet';showT('depT',false,e.message);});
}

function f(l,v){return '<div class="fr"><span class="fl">'+l+'</span><span class="fv">'+(v||'—')+'</span></div>';}
function fp(l,v){var c='py';if(!v)v='—';var vv=v.toLowerCase();if(vv.indexOf('success')>-1||vv.indexOf('approved')>-1)c='pg';else if(vv.indexOf('refund')>-1||vv.indexOf('fail')>-1)c='pr';else if(vv.indexOf('pending')>-1||vv.indexOf('processing')>-1)c='po';return '<div class="fr"><span class="fl">'+l+'</span><span class="fv"><span class="pill '+c+'">'+v+'</span></span></div>';}
function showT(id,ok,msg){var t=gi(id);t.className='toast '+(ok?'tok':'ter');t.textContent=ok?'Google Sheet updated successfully!':'Error: '+(msg||'Update failed');t.style.display='block';}
</script>
</body>
</html>
